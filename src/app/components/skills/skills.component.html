<section id="skills" class="section-padding section-alt">
  <div class="container">
    <div class="skills-header">
      <div class="skills-title">
        <span class="section-eyebrow">02 — {{ i18n.t().skills.section }}</span>
        <h2 class="section-heading">{{ i18n.t().skills.headline }}</h2>
      </div>
      <p class="section-lead skills-intro text-balance">{{ i18n.t().skills.intro }}</p>
    </div>

    <div class="skills-grid">
      @for (key of categoryKeys; track key) {
        @if (hasCategory(key)) {
          <div class="surface-card skill-card">
            <h3 class="skill-card-title">{{ i18n.t().skills.categories[key] }}</h3>
            <div class="skill-chips">
              @for (skill of skillsByCategory(key); track skill.name) {
                <span class="skill-chip">
                  <i [class]="skill.iconClass"></i>
                  <span>{{ skill.name }}</span>
                </span>
              }
            </div>
          </div>
        }
      }
    </div>
  </div>
</section>
